[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forgery"
version = "0.1.0"
description = "Classical image-forgery detection and localisation on CASIA v2.0"
requires-python = ">=3.11"
# minimum versions; requirements.txt pins the exact tested environment
dependencies = [
    "numpy>=2.0", "pandas>=2.2", "pillow>=10", "opencv-python>=4.9", "scipy>=1.12",
    "scikit-learn>=1.4", "scikit-image>=0.22", "matplotlib>=3.8", "joblib>=1.3",
    "pyyaml>=6", "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.30", "shap>=0.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: tests that need the CASIA2 dataset and generated data files"]
